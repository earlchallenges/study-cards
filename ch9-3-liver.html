    { term: 'ALT vs. AST', def: 'ALT is mostly in the liver, so it is the better marker of liver injury. AST is also in heart, muscle, kidney, and brain.', short: 'ALT is more liver-specific', pic: 'altAst' },
    { term: 'How to tell if a high ALP is from the liver', def: 'Check GGT. GGT rises with liver injury but not with bone disease.', short: 'Check GGT', pic: 'alpGgt' },
    { term: 'High unconjugated vs. high conjugated bilirubin', def: 'Unconjugated (indirect): too much red cell breakdown, or the liver can\'t conjugate (Gilbert syndrome). Conjugated (direct): bile can\'t drain, from blockage or hepatitis.', short: 'Too much made vs. can\'t drain', pic: 'bili' },
    { term: 'Labs that show true liver function', def: 'Albumin and prothrombin time (plus bilirubin). Low albumin or a long PT means the liver isn\'t making proteins. ALT and AST show injury, not function.', short: 'Albumin and prothrombin time', pic: 'synth' },
    { term: 'How the hepatitis viruses spread', def: 'A and E spread fecal-oral. B, C, and D spread through blood and body fluids. Hepatitis D can only cause infection along with hepatitis B.', short: 'A, E fecal-oral; B, C, D blood', pic: 'hepTypes' },
    { term: 'The phases of acute hepatitis', def: 'Incubation (no symptoms), prodromal (flu-like: nausea, fatigue, fever), icteric (jaundice), and recovery (jaundice clears about 6 to 8 weeks after exposure)', short: 'Incubation, prodromal, icteric, recovery', pic: 'phases' },
    { term: 'Signs of the icteric phase', say: 'ik-TAIR-ik', def: 'Jaundice, itching, dark tea-colored urine, clay-colored stools, and a large, tender liver', short: 'Jaundice, dark urine, clay stools', pic: 'icteric' },
    { term: 'Chronic vs. fulminant hepatitis', def: 'Chronic lasts over 6 months (usually B or C) and can lead to cirrhosis and cancer. Fulminant is rare and fast, causing liver failure and possible death within 3 weeks.', short: 'Over 6 months vs. rapid liver failure', pic: 'chronic' },
    { term: 'Hepatitis A antibody results', def: 'Anti-HAV IgM means active infection. Anti-HAV IgG without IgM means past infection or vaccination.', short: 'IgM active; IgG recovered or vaccinated', pic: 'hav' },
    { term: 'Hepatitis C test results', def: 'Anti-HCV with positive HCV RNA means active virus. Anti-HCV with negative RNA means past infection; the antibody stays positive for life.', short: 'RNA positive = active virus', pic: 'hcv' },

    { term: 'Labs in chronic hepatitis B (carrier)', def: 'HBsAg stays positive, with anti-HBc and anti-HBe positive', short: 'HBsAg stays positive', pic: 'hbChronic' },
    { term: 'Hepatitis vaccines', def: 'Hep A: all children starting at age 1 and at-risk adults. Hep B: all infants at birth and at-risk adults such as healthcare workers; it also prevents hep D.', short: 'Hep A from age 1; hep B at birth', pic: 'vaccine' },
    { term: 'Most common cause of acute liver failure in the U.S.', def: 'Acetaminophen overdose (about 50%). More than 4 grams a day is too much; toxicity is likely over about 12 grams or 250 mg/kg (150 mg/kg in children).', short: 'Acetaminophen overdose', pic: 'apap' },
    { term: 'Acetaminophen overdose treatment', def: 'Activated charcoal within 4 hours, and the antidote acetylcysteine (Mucomyst), best within 8 hours', short: 'Charcoal; acetylcysteine within 8 h', pic: 'nac' },
    { term: 'Cirrhosis', say: 'sih-ROH-sis', def: 'Chronic, mostly irreversible scarring of the liver. Stellate cells lay down scar, and nodules block blood and bile flow. Early fibrosis can sometimes reverse.', short: 'Irreversible liver scarring', pic: 'cirrhosis' },
    { term: 'Main causes of cirrhosis', def: 'Hepatitis C and alcohol are the most common in the U.S., followed by fatty liver disease (NASH) and hemochromatosis', short: 'Hepatitis C, alcohol, NASH', pic: 'cirrCause' },

    { term: 'Esophageal varices treatment', def: 'Prevention: a nonselective beta blocker and band ligation. Active bleeding: octreotide or terlipressin, balloon tamponade, banding, and TIPS as a last resort.', short: 'Beta blocker and banding; octreotide if bleeding', pic: 'varTx' },
    { term: 'Why ascites develops', say: 'uh-SY-teez', def: 'High portal pressure pushes fluid out, low albumin can\'t hold it in the vessels, and sodium retention adds more fluid', short: 'Portal pressure + low albumin', pic: 'ascites' },
    { term: 'Ascites treatment', def: 'Diuretics (spironolactone, furosemide), sodium restriction, paracentesis to drain fluid, or TIPS', short: 'Diuretics, low sodium, paracentesis', pic: 'ascTx' },
    { term: 'Why cirrhosis lowers platelets', def: 'Portal pressure enlarges the spleen, which traps platelets (hypersplenism), adding to the bleeding risk', short: 'Big spleen traps platelets', pic: 'spleen' },
    { term: 'Hepatic encephalopathy', say: 'en-sef-uh-LOP-uh-thee', def: 'The failing liver can\'t clear ammonia, which affects the brain: confusion, lethargy, sleep changes, and asterixis (flapping hand tremor)', short: 'Ammonia causes confusion and asterixis', pic: 'he' },
    { term: 'Hepatic encephalopathy treatment', def: 'Fix the trigger (like GI bleeding), lactulose to flush ammonia out in stool, and rifaximin to reduce ammonia-making gut bacteria', short: 'Lactulose and rifaximin', pic: 'heTx' },
    { term: 'Hormone effects of cirrhosis', def: 'The liver can\'t inactivate estrogen. Men develop breast tissue, small testes, impotence, and infertility; women get irregular periods.', short: 'Estrogen builds up', pic: 'estrogen' },
    { term: 'Signs of bile backing up in cirrhosis', def: 'Jaundice, intense itching from bile salts in the skin, dark urine, clay-colored stools, and poor absorption of fat and vitamins A, D, E, K', short: 'Jaundice, itching, dark urine, clay stools', pic: 'cirrSx' },
    { term: 'Spontaneous bacterial peritonitis', def: 'Gut bacteria (often E. coli) infect the ascites fluid, causing fever, belly pain, confusion, and kidney injury. Treat with antibiotics.', short: 'Infected ascites fluid', pic: 'sbp' },
    { term: 'Hepatorenal syndrome', say: 'hep-uh-toe-REE-nul', def: 'Kidney failure caused by liver disease, seen as rising creatinine. Treated with albumin, midodrine, octreotide or terlipressin, and transplant.', short: 'Kidney failure from liver disease', pic: 'hrs' },
    { term: 'Liver transplant requirements', def: 'Gives the best outcome in cirrhosis. Patients must be alcohol-free for at least 6 months and have no cancer. The top U.S. reason is chronic hepatitis C.', short: 'Alcohol-free 6 months, no cancer', pic: 'transplant' },
    { term: 'Simple fatty liver vs. NASH', def: 'Simple fatty liver has fat with little inflammation and doesn\'t progress. NASH (about 20% of NAFLD) adds inflammation and can lead to cirrhosis and cancer.', short: 'Fat only vs. fat + inflammation', pic: 'nafld' },
    { term: 'NAFLD risk factors', def: 'Obesity, type 2 diabetes, insulin resistance, high lipids, Hispanic ethnicity, and drugs like steroids. It is the most common liver disease in children.', short: 'Obesity, diabetes, insulin resistance', pic: 'nafldRisk' },
    { term: 'NAFLD treatment', def: 'Weight loss, healthy diet, exercise, no alcohol, and control of diabetes and lipids. Pioglitazone and vitamin E can improve NASH.', short: 'Weight loss; pioglitazone + vitamin E', pic: 'nafldTx' },
    { term: 'What happens in pancreatitis', say: 'pan-kree-uh-TY-tis', def: 'Pancreatic enzymes activate too early and digest the pancreas itself, causing swelling, bleeding, and tissue death', short: 'The pancreas digests itself', pic: 'panc' },
    { term: 'Most common cause of acute vs. chronic pancreatitis', def: 'Acute: gallstones. Chronic: alcohol.', short: 'Gallstones vs. alcohol', pic: 'pancCause' },
    { term: 'Acute pancreatitis pain', def: 'Epigastric pain that goes to the back, gets worse after eating, and eases when leaning forward or pulling the knees up, with nausea, vomiting, and fever', short: 'Epigastric pain to the back', pic: 'pancPain' },
    { term: 'Cullen sign vs. Grey Turner sign', def: 'Cullen: bruising around the navel. Grey Turner: bruising on the flanks. Both mean bleeding behind the abdomen, as in severe pancreatitis.', short: 'Navel vs. flank bruising', pic: 'cullen' },
    { term: 'Lipase vs. amylase in pancreatitis', def: 'Both rise to about 3 times normal. Lipase rises within 8 hours and stays up 14 days, so it is more reliable; amylase normalizes in 5 days.', short: 'Lipase stays up longer', pic: 'lipase' },
    { term: 'Complications of acute pancreatitis', def: 'ARDS, kidney failure, DIC, sepsis, pseudocyst or abscess, and low calcium. Mortality is about 15%.', short: 'ARDS, kidney failure, DIC, pseudocyst', pic: 'pancCx' },
    { term: 'Signs of chronic pancreatitis', def: 'Steatorrhea (oily, smelly stools), weight loss, and diabetes from losing insulin cells. It also raises pancreatic cancer risk.', short: 'Steatorrhea, weight loss, diabetes', pic: 'chronicPanc' },
    { term: 'Pancreatitis treatment', def: 'Rest the pancreas (nothing by mouth), IV fluids, IV pain control, NG suction for vomiting, then a low-fat diet with enzyme supplements, and no alcohol or smoking', short: 'NPO, IV fluids, pain control', pic: 'pancTx' },
  ],
};
