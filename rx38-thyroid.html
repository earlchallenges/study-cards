    { term: 'How to take levothyroxine', def: 'On an empty stomach, 1 hour before breakfast and other meds, at the same time daily. Stay on the same brand. It is lifelong. Never double a missed dose.', short: 'Empty stomach, 1 h before breakfast', pic: 'levoTake' },

    { term: 'Thyroid storm', def: 'A life-threatening emergency from untreated hyperthyroidism: HR 120–140 or AFib, fever over 102°F, heavy sweating, confusion, agitation, vomiting, and jaundice', short: 'Fever, tachycardia, confusion', pic: 'storm' },
    { term: 'Drug of choice for hyperthyroidism', def: 'Methimazole, a thionamide that blocks thyroid hormone synthesis. It is the drug of choice in nonpregnant patients and in the 2nd and 3rd trimesters.', short: 'Methimazole', pic: 'methimazole' },
    { term: 'Propylthiouracil (PTU)', def: 'A thionamide that blocks hormone synthesis and the conversion of T4 to T3. Drug of choice in thyroid storm and the first trimester. Higher risk of liver toxicity.', short: 'Thyroid storm, 1st trimester', pic: 'ptu' },

    { term: 'Radioactive iodine (RAI)', def: 'Destroys thyroid tissue to treat hyperthyroidism. Stop methimazole 3–4 days before. Never in pregnancy. Most patients need lifelong thyroid hormone afterward.', short: 'Destroys thyroid; not in pregnancy', pic: 'rai' },
