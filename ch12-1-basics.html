window.SET = {
  title: 'Bones, Joints, Muscles',
  chapter: 'Chapter 12 · Musculoskeletal Function · Part 1',
  pics: PICS,
  mystery: true,
  audio: 'audio/ch12-1',
  speak: {},
  cards: [
    { term: 'Ligament vs. tendon', def: 'A ligament connects bone to bone and keeps a joint stable. A tendon connects muscle to bone so the bone can move.', short: 'Bone-bone vs. muscle-bone', pic: 'ligTen' },
    { term: 'Axial vs. appendicular skeleton', def: 'Axial: the skull, spine, and rib cage. Appendicular: the arms, shoulders, pelvis, and legs. There are 206 bones in all.', short: 'Skull/spine/ribs vs. limbs', pic: 'skel' },
    { term: 'The 5 bone shapes', def: 'Long (femur, humerus), short (carpals, tarsals), flat (skull, ribs, sternum, scapula), irregular (vertebrae, mandible), and sesamoid (patella, inside a tendon)', short: 'Long, short, flat, irregular, sesamoid', pic: 'boneTypes' },
    { term: 'Parts of a long bone', say: 'die-AF-ih-sis, eh-PIF-ih-sis', def: 'The diaphysis is the shaft, the epiphyses are the ends, and the growth plate (epiphyseal plate) sits between them. The ends are covered in hyaline cartilage.', short: 'Shaft, ends, growth plate', pic: 'longBone' },
    { term: 'Where most red blood cells are made in adults', def: 'In flat bones, plus the vertebrae and pelvis. Red marrow is slowly replaced by fatty yellow marrow with age.', short: 'Flat bones', pic: 'flatRbc' },
    { term: 'Periosteum', say: 'pair-ee-OSS-tee-um', def: 'The tough covering on the outside of bone. Tendons attach to it, it holds osteoblasts for repair, and it is full of blood vessels and nerves.', short: 'Outer bone cover', pic: 'periost' },
    { term: 'Osteoblast vs. osteoclast vs. osteocyte', def: 'Osteoblasts build bone. Osteoclasts break bone down (resorption). Osteocytes are mature osteoblasts trapped in the matrix that maintain bone and help release calcium.', short: 'Build vs. break down vs. maintain', pic: 'boneCells' },
    { term: 'Bone remodeling', def: 'A constant cycle: osteoclasts clear away old bone, then osteoblasts lay down new osteoid (collagen and ground substance) that hardens with calcium phosphate crystals', short: 'Clasts clear, blasts rebuild', pic: 'remodel' },
    { term: 'Why bone needs minerals and collagen', def: 'Minerals make bone hard; too few makes it brittle. Collagen gives flexible strength; too little makes it too bendy.', short: 'Hard plus flexible', pic: 'matrix' },
    { term: 'RANKL vs. OPG', say: 'RANK-L, O P G', def: 'RANKL turns on osteoclasts and increases bone breakdown. OPG is a decoy that blocks RANKL and protects bone. Denosumab (Prolia) is a drug that blocks RANKL.', short: 'Breakdown switch vs. its blocker', pic: 'rankl' },
    { term: 'Why menopause raises osteoporosis risk', def: 'Estrogen normally blocks RANKL. When estrogen drops, RANKL is free to turn on osteoclasts, so bone breakdown speeds up.', short: 'Less estrogen, more RANKL', pic: 'estro' },
    { term: 'How glucocorticoids hurt bone', def: 'They raise RANKL, lower OPG, and slow osteoblasts, so more bone is lost than made', short: 'More RANKL, fewer osteoblasts', pic: 'steroid' },
    { term: 'PTH vs. calcitonin', def: 'PTH turns on osteoclasts to release calcium and raises blood calcium; it is the stronger regulator. Calcitonin calms osteoclasts and moves calcium into bone, lowering blood calcium.', short: 'Raises vs. lowers blood calcium', pic: 'calcHorm' },
    { term: 'Role of vitamin D in bone', def: 'With PTH, it helps absorb calcium from the gut and helps the kidneys hold on to calcium and phosphate', short: 'Absorbs calcium', pic: 'vitD' },
    { term: 'Appositional vs. endochondral bone growth', say: 'en-doh-KON-drul', def: 'Appositional: new bone is laid on the outer surface so bone gets wider. Endochondral: cartilage at the growth plate is replaced by bone so bone gets longer.', short: 'Wider vs. longer', pic: 'growth' },
    { term: 'The 3 types of cartilage', def: 'Hyaline: most common and weakest, on joint surfaces, ribs, and sternum. Elastic: flexible, in the outer ear. Fibrocartilage: strongest, in the disks and pubic symphysis.', short: 'Hyaline, elastic, fibrocartilage', pic: 'cart' },
    { term: 'Why cartilage heals poorly', def: 'It has no blood vessels or nerves and gets nutrients only by diffusion', short: 'No blood supply', pic: 'noVessel' },
    { term: 'The 3 joint types by movement', def: 'Synovial (diarthrosis) moves freely, like the shoulder. Amphiarthrosis moves slightly, like the spine. Synarthrosis does not move, like skull sutures.', short: 'Free, slight, none', pic: 'joints' },
    { term: 'Parts of a synovial joint', def: 'Articular cartilage on the bone ends, slippery synovial fluid (with hyaluronic acid) made by the synovial membrane, and a joint capsule with ligaments', short: 'Cartilage, fluid, membrane, capsule', pic: 'synov' },
    { term: 'Nucleus pulposus vs. annulus fibrosus', say: 'pul-POH-sus, AN-yoo-lus fy-BROH-sus', def: 'The nucleus pulposus is the soft gel center of a disk that absorbs shock. The annulus fibrosus is the tough outer ring that holds it in.', short: 'Gel center vs. tough ring', pic: 'disk' },
    { term: 'When the fontanelles close', say: 'fon-tuh-NELLS', def: 'The posterior fontanelle closes around 2 months. The anterior fontanelle closes by about 2 years.', short: 'Posterior 2 months, anterior 2 years', pic: 'font' },
    { term: 'Pelvic changes in pregnancy', def: 'Relaxin and estrogen loosen ligaments, the symphysis pubis and sacroiliac joints widen, and the pelvis tips forward, causing low back pain', short: 'Loose ligaments, wider pelvis', pic: 'preg' },
    { term: 'The 3 muscle types', def: 'Skeletal: voluntary and striated. Smooth: involuntary, in organ walls. Cardiac: involuntary, in the heart.', short: 'Skeletal, smooth, cardiac', pic: 'muscleTypes' },
    { term: 'Actin vs. myosin', def: 'Actin is the thin filament. Myosin is the thick filament that grabs and pulls actin. Their pattern makes muscle look striped and forms repeating units called sarcomeres.', short: 'Thin vs. thick filament', pic: 'sarc' },
    { term: 'Steps of muscle contraction', def: 'Acetylcholine at the nerve junction releases calcium, calcium binds troponin, tropomyosin moves off actin, myosin grabs actin, and ATP powers the pull', short: 'ACh, calcium, troponin, ATP', pic: 'contract' },
    { term: 'How a muscle relaxes', def: 'The nerve signal stops (or ATP runs out), calcium is pumped back into the sarcoplasmic reticulum, and tropomyosin covers actin again', short: 'Calcium pumped back', pic: 'relax' },
    { term: 'Muscle wrappings from inside out', say: 'en-doh-MY-see-um, pair-ih-MY-see-um, ep-ih-MY-see-um', def: 'Endomysium around each fiber, perimysium around bundles, and epimysium plus fascia around the whole muscle', short: 'Endo, peri, epi', pic: 'wrap' },
    { term: 'How muscles get bigger with exercise', def: 'Each fiber gets bigger with more contractile protein; the number of fibers stays about the same for life. About half the gain is lost 2 weeks after stopping.', short: 'Bigger fibers, not more fibers', pic: 'bigger' },
    { term: 'Sarcopenia', say: 'sar-koh-PEE-nee-uh', def: 'Age-related muscle loss: about 10% after age 50 and close to 30% after 80. Strength falls faster than muscle size.', short: 'Age-related muscle loss', pic: 'sarco' },
    { term: 'Developmental dysplasia of the hip (DDH)', say: 'dis-PLAY-zhuh', def: 'A shallow acetabulum does not fully cover the femoral head, so the hip can slip partly (subluxate) or fully (dislocate) out. The left hip is affected more often.', short: 'Shallow hip socket', pic: 'ddh' },
    { term: 'Risk factors for DDH', def: 'Female sex (up to 3 times more), breech position in the third trimester, and tight swaddling or cradleboards that hold the legs straight and together', short: 'Female, breech, tight swaddling', pic: 'ddhRisk' },
    { term: 'Barlow vs. Ortolani test', say: 'BAR-loh, or-toh-LAH-nee', def: 'Barlow: flex and adduct the hip and push back; an unstable hip slips out. Ortolani: flex and abduct and lift forward; the hip clunks back in.', short: 'Pushes out vs. clunks in', pic: 'barlow' },
    { term: 'Signs of DDH', say: 'gal-ee-AH-zee', def: 'Uneven thigh or buttock creases, a positive Galeazzi sign (one knee lower with knees bent), and limited hip abduction. Walking children may have a Trendelenburg limp.', short: 'Uneven creases, Galeazzi sign', pic: 'ddhSigns' },
    { term: 'DDH imaging and treatment', say: 'PAV-lik', def: 'Ultrasound in young infants (X-ray after 4 to 6 months, once the bones harden). Treated with a Pavlik harness for 2 to 3 months, or casting or surgery.', short: 'Ultrasound; Pavlik harness', pic: 'ddhTx' },
    { term: 'Osteogenesis imperfecta', say: 'oss-tee-oh-JEN-uh-sis im-per-FEK-tuh', def: 'Brittle bone disease: a defect in type I collagen genes makes bones fracture easily, sometimes over 100 times', short: 'Brittle bones from bad collagen', pic: 'oi' },
    { term: 'Main types of osteogenesis imperfecta', def: 'Type I is mildest (dominant). Type II is lethal (recessive). Type III is the most severe that survives (recessive). Type IV is moderate (dominant).', short: 'I mild, II lethal, III severe, IV moderate', pic: 'oiTypes' },
    { term: 'Classic signs of osteogenesis imperfecta', def: 'Blue sclera, hearing loss, brittle teeth (dentinogenesis imperfecta), short stature, loose ligaments, and easy bruising', short: 'Blue sclera, hearing loss', pic: 'oiSigns' },
    { term: 'Key drug for osteogenesis imperfecta', def: 'Bisphosphonates, which slow bone breakdown and cut fractures, along with team care and PT and OT', short: 'Bisphosphonates', pic: 'oiTx' },
    { term: 'Kyphosis vs. lordosis vs. scoliosis', say: 'ky-FOH-sis, lor-DOH-sis, skoh-lee-OH-sis', def: 'Kyphosis: thoracic spine curves outward (hunchback). Lordosis: lumbar spine curves inward too much (swayback). Scoliosis: the spine curves sideways.', short: 'Hunchback, swayback, sideways', pic: 'curves' },
    { term: 'Scheuermann kyphosis vs. poor posture', say: 'SHOY-er-mahn', def: 'Scheuermann kyphosis appears in the teen growth spurt and the curve stays when bending or lying flat. Poor posture corrects when lying flat.', short: 'Curve stays vs. corrects', pic: 'scheu' },
    { term: 'Causes of kyphosis in adults', def: 'Osteoporosis, disk or joint degeneration, and vertebral fractures. A severe curve can limit lung expansion.', short: 'Osteoporosis, fractures', pic: 'adultKyph' },
    { term: 'Scoliosis basics', def: 'Usually idiopathic, more common in girls, and gets worse during growth spurts. Vertebrae can also twist.', short: 'Idiopathic, girls, growth spurts', pic: 'scol' },
    { term: 'Adams forward bend test', def: 'The patient bends forward at the waist; a rib hump or uneven back points to scoliosis. A scoliometer measures the trunk twist.', short: 'Bend forward, look for rib hump', pic: 'adams' },
    { term: 'Cobb angle', def: 'The curve angle measured on X-ray. Over 10 degrees diagnoses scoliosis; a higher angle means a worse curve.', short: 'Over 10 degrees = scoliosis', pic: 'cobb' },
  ],
};
</script>
