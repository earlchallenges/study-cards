    { term: 'Aspirin in CHD', def: 'For secondary prevention in known CHD (75–162 mg daily). For primary prevention, only high-risk adults 40–70 with low bleeding risk; it is no longer routinely recommended.', short: 'Yes for known CHD; rarely for primary', pic: 'aspirin' },

    { term: 'Best drug for variant (Prinzmetal) angina', def: 'A calcium channel blocker, because the pain comes from coronary artery spasm, often at rest', short: 'Calcium channel blocker', pic: 'angina' },

    { term: 'ACE inhibitors and ARBs shown to cut cardiovascular deaths', def: 'ACE inhibitors ramipril and perindopril; ARBs telmisartan (if ACE-I not tolerated) and valsartan (after MI with LV dysfunction)', short: 'Ramipril, perindopril, telmisartan, valsartan', pic: 'acei' },

    { term: 'Teaching sublingual nitroglycerin for chest pain', def: 'Put 1 tablet under the tongue at the first sign of pain and let it dissolve. If not better in 5 minutes, call 911. Repeat every 5 minutes, no more than 3 tablets in 15 minutes.', short: '1 tab; 911 at 5 min; max 3 in 15 min', pic: 'ntgUse' },

    { term: 'Drugs that must never be taken with nitrates', def: 'PDE-5 inhibitors (sildenafil, vardenafil, tadalafil). Together they can cause severe hypotension, syncope, MI, or death.', short: 'PDE-5 inhibitors (sildenafil)', pic: 'pde5' },
    { term: 'Nitrate side effects', def: 'Throbbing headache (most common), dizziness, orthostatic hypotension, flushing, reflex tachycardia, and syncope', short: 'Headache, hypotension', pic: 'ntgAE' },
