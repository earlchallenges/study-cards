  mystery: true,
  audio: 'audio/rx10',
  speak: {},
  cards: [
    { term: 'ACC/AHA definition of hypertension', def: 'Blood pressure of 130/80 mmHg or higher on two readings on two separate occasions. Stage 1 is 130–139 or 80–89; stage 2 is 140/90 or higher.', short: '130/80 or higher', pic: 'define' },

    { term: 'The 4 first-line drug classes for hypertension', def: 'Thiazide diuretics, ACE inhibitors, ARBs, and calcium channel blockers', short: 'Thiazide, ACE-I, ARB, CCB', pic: 'firstLine' },
    { term: 'Starting treatment in stage 2 hypertension', def: 'Lifestyle changes plus two drugs from different first-line classes', short: 'Two drugs from different classes', pic: 'firstLine' },
    { term: 'Second-line antihypertensives', def: 'Beta blockers, loop diuretics, direct renin inhibitors, alpha-1 blockers, central alpha-2 agonists, and direct vasodilators', short: 'Beta blockers, alpha blockers, clonidine, vasodilators', pic: 'secondLine' },
    { term: 'When to start a drug in stage 1 hypertension', def: 'If the patient has clinical CVD or a 10-year ASCVD risk of 10% or more: lifestyle plus one drug, recheck in 1 month. Otherwise lifestyle alone, recheck in 3–6 months.', short: 'CVD or ASCVD risk 10%+', pic: 'stage1' },
    { term: 'Blood pressure goal for most adults', def: 'Under 130/80, including those with diabetes, CKD, heart failure, or coronary heart disease', short: 'Under 130/80', pic: 'goal' },

    { term: 'Best first drug with chronic kidney disease or diabetic kidney disease', def: 'An ACE inhibitor or ARB, because they protect the kidneys (losartan and irbesartan are used for diabetic nephropathy)', short: 'ACE inhibitor or ARB', pic: 'ckd' },
    { term: 'Antihypertensives to avoid in pregnancy', def: 'ACE inhibitors, ARBs, and direct renin inhibitors (aliskiren), because they harm the fetus. Women who may become pregnant should not be on them.', short: 'ACE-Is, ARBs, aliskiren', pic: 'preg' },
    { term: 'Primary vs. secondary hypertension', def: 'Primary (essential) has no single cause and is over 90% of cases. Secondary comes from a treatable condition or drug.', short: 'No cause found vs. treatable cause', pic: 'primary' },
    { term: 'Causes of secondary hypertension', def: 'Sleep apnea, chronic kidney disease, primary aldosteronism, hyperthyroidism, heavy alcohol, coarctation of the aorta, and drugs like NSAIDs, decongestants, oral contraceptives, SNRIs, and amphetamines', short: 'Sleep apnea, CKD, aldosteronism, NSAIDs', pic: 'secondary' },
    { term: 'When to suspect secondary hypertension', def: 'Sudden onset, onset before age 30 without risk factors, or onset after starting a new medication', short: 'Sudden, young, or new drug', pic: 'secondary' },
    { term: 'Hypertension risk factors', def: 'Older age, Black race, family history, obesity, inactivity, high sodium or low potassium intake, alcohol, tobacco, stress, sleep apnea, diabetes, and kidney disease', short: 'Age, race, obesity, sodium, alcohol', pic: 'risk' },
    { term: 'White coat vs. masked hypertension', def: 'White coat: BP is high in the office but normal at home. Masked: BP is normal in the office but high at home, and carries higher cardiovascular risk.', short: 'High in office vs. high at home', pic: 'whiteCoat' },
    { term: 'Teaching home blood pressure monitoring', def: 'Use the same validated cuff above the elbow bend, take 2 readings 1 minute apart in the morning before meds and in the evening, and record them', short: 'Same cuff, 2 readings, morning and evening', pic: 'homeBP' },
    { term: 'Lifestyle changes for hypertension', def: 'Lose weight (about 1 mmHg per kg), DASH diet, sodium under 1,500 mg/day, potassium 3,500–5,000 mg, aerobic exercise 90–150 minutes a week, and limit alcohol', short: 'Weight loss, DASH, low sodium, exercise', pic: 'lifestyle' },
    { term: 'Blood pressure formula', def: 'Blood pressure equals cardiac output times peripheral resistance. Normal mean arterial pressure is 70–110 mmHg.', short: 'Cardiac output × peripheral resistance', pic: 'bpPhys' },
    { term: 'Renin-angiotensin-aldosterone system (RAAS)', def: 'The kidney releases renin; angiotensin I is turned into angiotensin II by ACE (mostly in the lungs). Angiotensin II constricts vessels and triggers aldosterone, which holds onto sodium and water.', short: 'Renin → angiotensin II → aldosterone', pic: 'raas' },
    { term: 'How thiazide diuretics lower blood pressure', def: 'They block sodium and chloride reabsorption in the distal tubule, lowering fluid volume at first and peripheral resistance over time', short: 'Block Na/Cl at distal tubule', pic: 'thiazide' },
    { term: 'Preferred thiazide diuretic', def: 'Chlorthalidone, a thiazide-like diuretic that lasts longer and has better outcome evidence than HCTZ', short: 'Chlorthalidone', pic: 'chlorthal' },
    { term: 'Thiazide side effects', def: 'Low potassium, sodium, and magnesium; high calcium, uric acid (gout), and glucose; sulfa allergy cross-reaction; photosensitivity', short: 'Low K, high glucose and uric acid', pic: 'thiazideAE' },
    { term: 'Thiazides in poor kidney function', def: 'Most thiazides don\'t work well when CrCl is under 30 mL/min; metolazone still works', short: 'Weak under CrCl 30', pic: 'thiazideCrCl' },
    { term: 'How ACE inhibitors work', def: 'They block ACE, so less angiotensin II and aldosterone are made, and bradykinin builds up. Names end in -pril (lisinopril, ramipril, benazepril, quinapril).', short: 'Block ACE (-pril)', pic: 'acei' },
    { term: 'ACE inhibitor side effects', def: 'Dry cough (from bradykinin), angioedema (more common in Black patients), hyperkalemia, first-dose hypotension, and a rise in creatinine', short: 'Cough, angioedema, high K', pic: 'aceiAE' },
    { term: 'ACE inhibitor contraindications', def: 'Pregnancy (black box warning), a history of angioedema, and combining with an ARB or aliskiren. Avoid potassium salt substitutes.', short: 'Pregnancy, angioedema history', pic: 'aceiNo' },
    { term: 'How ARBs work', def: 'They block angiotensin II at the AT1 receptor, without building up bradykinin. Names end in -sartan (losartan, valsartan, irbesartan, candesartan).', short: 'Block AT1 receptor (-sartan)', pic: 'arb' },
    { term: 'Switch for a patient with ACE inhibitor cough', def: 'An ARB, which rarely causes cough. Never combine an ACE inhibitor with an ARB.', short: 'Switch to an ARB', pic: 'arbVsAcei' },
    { term: 'ARB not controlling blood pressure', def: 'Add a thiazide diuretic rather than raising the ARB dose, because higher ARB doses add little', short: 'Add a thiazide', pic: 'arbAdd' },
    { term: 'Dihydropyridine vs. non-dihydropyridine CCBs', def: 'Dihydropyridines (amlodipine, nifedipine, felodipine) mostly relax blood vessels. Non-DHPs (diltiazem, verapamil) also slow heart rate and conduction.', short: 'Vessels vs. heart rate', pic: 'ccb' },
    { term: 'Most common amlodipine side effect', def: 'Peripheral (ankle) edema from vasodilation, more common in women and at higher doses. Also headache, flushing, and palpitations.', short: 'Ankle edema', pic: 'dhpAE' },
    { term: 'CCBs in heart failure with reduced ejection fraction', def: 'Avoid them. If one is essential, use amlodipine or felodipine. Diltiazem and verapamil are contraindicated.', short: 'Avoid; amlodipine if essential', pic: 'amlodipine' },
    { term: 'Diltiazem and verapamil cautions', def: 'Don\'t combine with beta blockers (bradycardia, heart block); avoid in HFrEF, AV block, and sick sinus syndrome; many CYP3A4 interactions. Verapamil commonly causes constipation.', short: 'No beta blockers; avoid HFrEF', pic: 'nondhp' },
    { term: 'Beta blockers for hypertension', def: 'Second-line unless there is another reason to use them (like heart failure or coronary disease). Taper over 1–2 weeks; never stop suddenly.', short: 'Second-line; taper to stop', pic: 'bb' },
    { term: 'Aliskiren (Tekturna)', say: 'uh-LIS-kih-ren', def: 'A direct renin inhibitor. Never combine with an ACE inhibitor or ARB; black box warning in pregnancy; can cause hyperkalemia.', short: 'Direct renin inhibitor', pic: 'aliskiren' },
    { term: 'Alpha-1 blockers (prazosin, doxazosin, terazosin)', def: 'Relax vessel smooth muscle and also help BPH. Main risk is first-dose orthostatic hypotension, so give the first dose at bedtime. On the Beers list for older adults.', short: 'First-dose hypotension; bedtime', pic: 'alpha1' },
    { term: 'Clonidine', def: 'A central alpha-2 agonist used as last-line therapy. Causes sedation, bradycardia, and dry mouth. Stopping suddenly causes rebound hypertension, so taper slowly.', short: 'Last-line; rebound if stopped', pic: 'clonidine' },
    { term: 'Methyldopa', def: 'A central alpha-2 agonist used in pregnancy. Causes drowsiness, a positive Coombs test with possible hemolytic anemia, and liver problems.', short: 'Pregnancy; Coombs-positive', pic: 'methyldopa' },
    { term: 'Hydralazine', def: 'A direct vasodilator that causes reflex tachycardia and fluid retention, so it is given with a diuretic and beta blocker. Can cause a lupus-like syndrome; used for preeclampsia.', short: 'Vasodilator; lupus-like syndrome', pic: 'hydralazine' },
    { term: 'Minoxidil', def: 'A last-resort vasodilator for severe hypertension, given with a beta blocker and a diuretic because it causes tachycardia and fluid retention', short: 'Last resort; add BB + diuretic', pic: 'minox' },
    { term: 'Ways to improve antihypertensive adherence', def: 'Single-pill combinations, once-daily drugs, home BP monitoring, using one pharmacy, reminders, and teach-back education', short: 'Combo pills, once daily, home BP', pic: 'adherence' },
  ],
};
</script>
